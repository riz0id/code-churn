[project]
name = "code-churn"
version = "0.1.0"
description = "Measure code churn from git history: lines added, then changed again within a time window"
requires-python = ">=3.12"
# Dependencies are managed by Nix — add them to `projectDeps` in flake.nix,
# not here. This list stays empty so pip/uv never resolve anything.
dependencies = []

[project.scripts]
code-churn = "code_churn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_churn"]

[tool.black]
line-length = 88

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = ["src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
